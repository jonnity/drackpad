[package]
name = "drackpad"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
image = "0.25.10"
ndarray = "0.17.2"
# `default-features = false` drops `download-binaries`/`copy-dylibs` (which need
# network access to the pyke CDN) and pins the ONNX Runtime API level. We load
# the runtime at runtime via `ORT_DYLIB_PATH` (`load-dynamic`), so the API level
# must match the shared library version — `api-20` ⇒ ONNX Runtime 1.20.x.
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "api-20",
] }
